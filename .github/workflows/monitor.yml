name: Monitor Windows PR Activity

on:
  workflow_dispatch:
    inputs:
      start_date:
        description: 'Start date (YYYY-MM-DD)'
        required: false
        default: '2024-11-05'
      end_date:
        description: 'End date (YYYY-MM-DD)'
        required: false
        default: '2024-11-10'
      repo_owner:
        description: 'Repository owner (e.g., pytorch or your-username)'
        required: false
        default: 'pytorch'
  schedule:
    - cron: '28 19 * * *'  # Runs at 19:30 UTC (in ~4 minutes for testing)
  push:
    branches:
      - main
      - master

permissions:
  contents: read

jobs:
  monitor:
    runs-on: ubuntu-latest
    
    steps:
      - name: Analyze date range (Nov 5 - Nov 10)
        run: |
          # Date range: 2024-11-05 to 2024-11-10
          START_DATE="2024-11-05"
          END_DATE="2024-11-10"
          
          echo "=========================================="
          echo "Windows PR Activity Report"
          echo "Date Range: $START_DATE to $END_DATE"
          echo "=========================================="
          echo ""
          
          # Convert dates to epoch for iteration
          current_date="$START_DATE"
          
          while [ "$current_date" != "$(date -u -d "$END_DATE + 1 day" '+%Y-%m-%d')" ]; do
            echo ""
            echo "=========================================="
            echo "📅 ANALYZING DATE: $current_date"
            echo "=========================================="
            
            # Set time range for this specific date
            SINCE="${current_date}T00:00:00Z"
            UNTIL=$(date -u -d "$current_date + 1 day" '+%Y-%m-%dT%H:%M:%SZ')
            REPO="${{ github.repository }}"  # Automatically uses current repo (e.g., your-org/pytorch)
            
            echo "⏰ TIME RANGE: $current_date 00:00:00 UTC → $(date -u -d "$current_date + 1 day" '+%Y-%m-%d %H:%M:%S UTC')"
            echo "📦 REPOSITORY: $REPO"
            echo ""
            
            # Use GitHub Search API to find PRs updated on the specific date
            SEARCH_DATE="$current_date"
            
            # Search for open PRs updated on the target date (up to 200 results)
            echo "Fetching open PRs updated on $SEARCH_DATE..."
            curl -s "https://api.github.com/search/issues?q=repo:$REPO+is:pr+is:open+base:main+updated:$SEARCH_DATE&per_page=100&page=1" \
              -H "Accept: application/vnd.github.v3+json" \
              -H "Authorization: Bearer ${{ github.token }}" \
              | jq '.items' > open_prs_page1.json
            
            sleep 2  # Rate limit protection
            
            curl -s "https://api.github.com/search/issues?q=repo:$REPO+is:pr+is:open+base:main+updated:$SEARCH_DATE&per_page=100&page=2" \
              -H "Accept: application/vnd.github.v3+json" \
              -H "Authorization: Bearer ${{ github.token }}" \
              | jq '.items' > open_prs_page2.json
            
            # Combine open PRs
            jq -s 'add' open_prs_page1.json open_prs_page2.json > open_prs_all.json
            
            # Convert to our format and filter by exact time range
            jq -c --arg since "$SINCE" --arg until "$UNTIL" '.[] | select(.updated_at >= $since and .updated_at <= $until) | {number: .number, title: .title, author: .user.login, created_at: .created_at, updated_at: .updated_at, state: "open", is_new: (.created_at >= $since)}' open_prs_all.json > active_prs.json
            
            # Search for merged PRs on the target date (up to 200 results)
            echo "Fetching merged PRs on $SEARCH_DATE..."
            sleep 2  # Rate limit protection
            
            curl -s "https://api.github.com/search/issues?q=repo:$REPO+is:pr+is:merged+base:main+merged:$SEARCH_DATE&per_page=100&page=1" \
              -H "Accept: application/vnd.github.v3+json" \
              -H "Authorization: Bearer ${{ github.token }}" \
              | jq '.items' > merged_search_page1.json
            
            sleep 2  # Rate limit protection
            
            curl -s "https://api.github.com/search/issues?q=repo:$REPO+is:pr+is:merged+base:main+merged:$SEARCH_DATE&per_page=100&page=2" \
              -H "Accept: application/vnd.github.v3+json" \
              -H "Authorization: Bearer ${{ github.token }}" \
              | jq '.items' > merged_search_page2.json
            
            # Combine merged search results
            jq -s 'add' merged_search_page1.json merged_search_page2.json > merged_search_all.json
            
            # Convert merged PRs to our format (limit to first 20 to reduce API calls)
            # Start with empty file (no initial content)
            > merged_prs.json
            for pr_num in $(jq -r '.[].number' merged_search_all.json 2>/dev/null | head -20); do
              curl -s "https://api.github.com/repos/$REPO/pulls/$pr_num" \
                -H "Accept: application/vnd.github.v3+json" \
                -H "Authorization: Bearer ${{ github.token }}" \
                | jq -c --arg since "$SINCE" --arg until "$UNTIL" 'select(.merged_at != null and .merged_at >= $since and .merged_at <= $until) | {number: .number, title: .title, author: .user.login, created_at: .created_at, merged_at: .merged_at, state: "merged"}' \
                >> merged_prs.json || true
              sleep 0.5  # Small delay between PR fetches
            done
            
            # Ensure file exists even if empty
            touch merged_prs.json
            
            # Combine active and merged PRs
            cat active_prs.json merged_prs.json > prs.json
            
            # Count PRs (count non-empty lines with proper handling of empty files)
            TOTAL_ACTIVE=$(grep -c '^{' active_prs.json 2>/dev/null || echo "0")
            TOTAL_ACTIVE=$(echo "$TOTAL_ACTIVE" | tr -d '\n')
            NEW_PRS=$(jq -s '[.[] | select(.is_new == true)] | length' active_prs.json 2>/dev/null || echo "0")
            NEW_PRS=$(echo "$NEW_PRS" | tr -d '\n')
            UPDATED_PRS=$(jq -s '[.[] | select(.is_new == false)] | length' active_prs.json 2>/dev/null || echo "0")
            UPDATED_PRS=$(echo "$UPDATED_PRS" | tr -d '\n')
            TOTAL_MERGED=$(grep -c '^{' merged_prs.json 2>/dev/null || echo "0")
            TOTAL_MERGED=$(echo "$TOTAL_MERGED" | tr -d '\n')
            TOTAL_PRS=$(grep -c '^{' prs.json 2>/dev/null || echo "0")
            TOTAL_PRS=$(echo "$TOTAL_PRS" | tr -d '\n')
            
            echo "Found $TOTAL_ACTIVE active PRs: $NEW_PRS newly created, $UPDATED_PRS recently updated"
            echo "Found $TOTAL_MERGED merged PRs"
            
            # Create Python analysis script inline
            cat > analyze.py << 'PYTHON_SCRIPT'
import json
import sys
import subprocess

# Windows-related patterns
WINDOWS_PATTERNS = [
    # Explicit Windows paths
    'windows/', 'win-', '.bat', '.ps1', 'msvc', 'visual_studio',
    'windows-pull', 'windows-binary', '_win-build', 'win-test',
    'build_pytorch.bat', 'mingw', '.ci/pytorch/windows/',
    
    # Core build files (affect Windows compilation)
    'cmakelists.txt', 'setup.py', 'pyproject.toml',
    'cmake/', 'tools/build_pytorch_libs.py',
    
    # C10 core and utilities
    'c10/core/', 'c10/cuda/', 'c10/util/',
    
    # ATen core dispatch and device management
    'aten/src/aten/core/', 'aten/src/aten/native/dispatchstub',
    'aten/src/aten/native/cpufallback', 'aten/src/aten/dispatch',
    'aten/src/aten/context', 'aten/src/aten/device',
    'aten/src/aten/deviceguard',
    
    # Torch CSRC - Python bindings and JIT
    'torch/csrc/cuda/', 'torch/csrc/jit/codegen/cuda/',
    'torch/csrc/autograd/engine/', 'torch/csrc/distributed/c10d/',
    
    # ATen CUDA implementations
    'aten/src/aten/cuda/', 'aten/src/aten/native/cuda/',
    'aten/src/aten/native/cudnn/', 'aten/src/aten/cudnn/',
    
    # Third-party GPU dependencies
    'third_party/cudnn/', 'third_party/cutlass/',
    'third_party/fbgemm/', 'third_party/onnx/',
    
    # ATen build configuration
    'aten/cmakelists.txt', 'aten/src/aten/cmakelists.txt',
    'aten/src/aten/cuda/cudaconfig.h',
    
    # FuncTorch (affects GPU compilation)
    'functorch/src/',
    
    # Memory management
    'aten/src/aten/native/memory.cpp', 'c10/core/allocator'
]

WINDOWS_KEYWORDS = [
    'windows', 'win32', 'msvc', 'visual studio', 'mingw', '.bat',
    'winbuild', 'vcpkg'
]

def is_windows_file(filepath):
    """Check if file is Windows-related."""
    filepath_lower = filepath.lower()
    
    for pattern in WINDOWS_PATTERNS:
        if pattern in filepath_lower:
            return True
    
    if filepath_lower.endswith(('.bat', '.ps1')):
        return True
    
    path_parts = filepath_lower.split('/')
    if 'windows' in path_parts or 'win' in path_parts:
        return True
    
    return False

def is_windows_pr(title, files):
    """Check if PR is Windows-related."""
    title_lower = title.lower()
    
    # Check title
    if any(keyword in title_lower for keyword in WINDOWS_KEYWORDS):
        return True
    
    # Check files
    return any(is_windows_file(f) for f in files)

def get_pr_files(pr_number, token, repo):
    """Get files changed in a PR."""
    import time
    try:
        result = subprocess.run(
            ['curl', '-s',
             f'https://api.github.com/repos/{repo}/pulls/{pr_number}/files?per_page=100',
             '-H', 'Accept: application/vnd.github.v3+json',
             '-H', f'Authorization: Bearer {token}'],
            capture_output=True,
            text=True,
            check=True
        )
        data = json.loads(result.stdout)
        # Check if we hit rate limit
        if isinstance(data, dict) and 'message' in data:
            if 'rate limit' in data['message'].lower():
                return None  # Return None to indicate rate limit
        time.sleep(0.3)  # Small delay to avoid rate limiting
        return [f['filename'] for f in data]
    except Exception as e:
        return []

# Get GitHub token and repo from environment
token = sys.argv[1] if len(sys.argv) > 1 else ''
repo = sys.argv[2] if len(sys.argv) > 2 else 'pytorch/pytorch'

# Load PRs
prs = []
with open('prs.json', 'r') as f:
    for line in f:
        if line.strip():
            try:
                pr_data = json.loads(line)
                # Skip if it's not a dict (e.g., empty list [])
                if isinstance(pr_data, dict) and 'number' in pr_data:
                    prs.append(pr_data)
            except json.JSONDecodeError as e:
                pass

# Analyze each PR
windows_prs = []
new_windows_prs = []
updated_windows_prs = []
merged_windows_prs = []
all_files = set()
windows_files = set()
rate_limit_hit = False

for i, pr in enumerate(prs):
    pr_number = pr['number']
    pr_state = pr.get('state', 'open')
    is_new = pr.get('is_new', False)
    
    # Check title first for Windows keywords
    title_matches = is_windows_pr(pr['title'], [])
    
    # Fetch files if not hit rate limit
    files = []
    if not rate_limit_hit:
        files = get_pr_files(pr_number, token, repo)
        if files is None:  # Rate limit hit
            rate_limit_hit = True
            files = []
        else:
            all_files.update(files)
    
    # Determine if Windows-related (by title or files)
    if title_matches or is_windows_pr(pr['title'], files):
        pr['files'] = files
        pr['windows_files'] = [f for f in files if is_windows_file(f)]
        windows_prs.append(pr)
        windows_files.update(pr['windows_files'])
        
        if pr_state == 'merged':
            merged_windows_prs.append(pr)
        elif is_new:
            new_windows_prs.append(pr)
        else:
            updated_windows_prs.append(pr)

# Generate report
active_prs = [p for p in prs if p.get('state') != 'merged']
merged_prs = [p for p in prs if p.get('state') == 'merged']

report = {
    'total_prs': len(prs),
    'total_active': len(active_prs),
    'total_merged': len(merged_prs),
    'windows_prs': len(windows_prs),
    'new_prs': len([p for p in active_prs if p.get('is_new', False)]),
    'updated_prs': len([p for p in active_prs if not p.get('is_new', False)]),
    'new_windows_prs': len(new_windows_prs),
    'updated_windows_prs': len(updated_windows_prs),
    'merged_windows_prs': len(merged_windows_prs),
    'total_files_changed': len(all_files),
    'windows_files_changed': len(windows_files),
    'prs': windows_prs,
    'new_prs_list': new_windows_prs,
    'updated_prs_list': updated_windows_prs,
    'merged_prs_list': merged_windows_prs
}

with open('analysis_report.json', 'w') as f:
    json.dump(report, f, indent=2)

# Print summary
print(f"\n📊 PR ACTIVITY:")
print(f"  Active PRs: {report['total_active']}")
print(f"    - Newly created: {report['new_prs']}")
print(f"    - Recently updated: {report['updated_prs']}")
print(f"  Merged to main: {report['total_merged']}")
print(f"\n🪟 WINDOWS-RELATED PRs:")
print(f"  Total: {len(windows_prs)}")
print(f"    - New: {len(new_windows_prs)}")
print(f"    - Updated: {len(updated_windows_prs)}")
print(f"    - Merged: {len(merged_windows_prs)}")
print(f"\n📁 FILES AFFECTED:")
print(f"  Total files changed: {len(all_files)}")
print(f"  Windows files changed: {len(windows_files)}")

PYTHON_SCRIPT
            
            # Run analysis with GitHub token and repo
            python3 analyze.py "${{ github.token }}" "$REPO"
            
            # Read results
            WINDOWS_PRS=$(jq '.windows_prs' analysis_report.json 2>/dev/null || echo "0")
            WINDOWS_PRS=$(echo "$WINDOWS_PRS" | tr -d '\n')
            NEW_WINDOWS_PRS=$(jq '.new_windows_prs' analysis_report.json 2>/dev/null || echo "0")
            NEW_WINDOWS_PRS=$(echo "$NEW_WINDOWS_PRS" | tr -d '\n')
            UPDATED_WINDOWS_PRS=$(jq '.updated_windows_prs' analysis_report.json 2>/dev/null || echo "0")
            UPDATED_WINDOWS_PRS=$(echo "$UPDATED_WINDOWS_PRS" | tr -d '\n')
            MERGED_WINDOWS_PRS=$(jq '.merged_windows_prs' analysis_report.json 2>/dev/null || echo "0")
            MERGED_WINDOWS_PRS=$(echo "$MERGED_WINDOWS_PRS" | tr -d '\n')
            TOTAL_FILES=$(jq '.total_files_changed' analysis_report.json 2>/dev/null || echo "0")
            TOTAL_FILES=$(echo "$TOTAL_FILES" | tr -d '\n')
            WINDOWS_FILES=$(jq '.windows_files_changed' analysis_report.json 2>/dev/null || echo "0")
            WINDOWS_FILES=$(echo "$WINDOWS_FILES" | tr -d '\n')
            
            echo ""
            echo "=========================================="
            echo ""
            
            # Move to next date
            current_date=$(date -u -d "$current_date + 1 day" '+%Y-%m-%d')
          done
          
          echo ""
          echo "=========================================="
          echo "✅ ANALYSIS COMPLETE"
          echo "=========================================="
