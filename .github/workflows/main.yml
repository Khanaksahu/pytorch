name: Monitor Windows PR Activity

on:
  workflow_dispatch:
  schedule:
    - cron: '0 23 * * *'

permissions:
  contents: read

jobs:
  monitor:
    runs-on: ubuntu-latest
    
    steps:
      - name: Analyze PRs for date
        run: |
          # Set the date to analyze
          START_DATE="2024-11-05"
          REPO="${{ github.repository }}"
          
          echo "=========================================="
          echo "Windows PR Activity Report"
          echo "Repository: $REPO"
          echo "Date: $START_DATE"
          echo "=========================================="
          
          # Fetch open PRs
          echo "Fetching open PRs..."
          curl -s "https://api.github.com/search/issues?q=repo:$REPO+is:pr+is:open+updated:$START_DATE&per_page=100" \
            -H "Accept: application/vnd.github.v3+json" \
            -H "Authorization: Bearer ${{ github.token }}" > open_prs.json
          
          # Fetch merged PRs  
          echo "Fetching merged PRs..."
          curl -s "https://api.github.com/search/issues?q=repo:$REPO+is:pr+is:merged+merged:$START_DATE&per_page=100" \
            -H "Accept: application/vnd.github.v3+json" \
            -H "Authorization: Bearer ${{ github.token }}" > merged_prs.json
          
          # Count PRs
          TOTAL_OPEN=$(jq '.total_count' open_prs.json 2>/dev/null || echo "0")
          TOTAL_MERGED=$(jq '.total_count' merged_prs.json 2>/dev/null || echo "0")
          TOTAL_PRS=$((TOTAL_OPEN + TOTAL_MERGED))
          
          echo "Total Open PRs: $TOTAL_OPEN"
          echo "Total Merged PRs: $TOTAL_MERGED"
          echo "Total PRs: $TOTAL_PRS"
          
          # Count Windows-related PRs by title keywords
          WINDOWS_OPEN=$(jq '[.items[] | select(.title | ascii_downcase | test("windows|win32|msvc|mingw|\\.bat"))] | length' open_prs.json 2>/dev/null || echo "0")
          WINDOWS_MERGED=$(jq '[.items[] | select(.title | ascii_downcase | test("windows|win32|msvc|mingw|\\.bat"))] | length' merged_prs.json 2>/dev/null || echo "0")
          WINDOWS_TOTAL=$((WINDOWS_OPEN + WINDOWS_MERGED))
          
          echo "Windows Open PRs: $WINDOWS_OPEN"
          echo "Windows Merged PRs: $WINDOWS_MERGED"
          echo "Windows Total PRs: $WINDOWS_TOTAL"
          
          # Create summary
          echo "# Windows PR Activity Report" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Repository:** $REPO" >> $GITHUB_STEP_SUMMARY
          echo "**Date:** $START_DATE" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "## 📊 Summary" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Metric | Count |" >> $GITHUB_STEP_SUMMARY
          echo "|--------|-------|" >> $GITHUB_STEP_SUMMARY
          echo "| Total PRs (Open + Merged) | $TOTAL_PRS |" >> $GITHUB_STEP_SUMMARY
          echo "| Open PRs | $TOTAL_OPEN |" >> $GITHUB_STEP_SUMMARY
          echo "| Merged PRs | $TOTAL_MERGED |" >> $GITHUB_STEP_SUMMARY
          echo "| **Windows PRs** | **$WINDOWS_TOTAL** |" >> $GITHUB_STEP_SUMMARY
          echo "| - Windows Open | $WINDOWS_OPEN |" >> $GITHUB_STEP_SUMMARY
          echo "| - Windows Merged | $WINDOWS_MERGED |" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          
          # Show some example Windows PRs
          echo "## 🪟 Windows PRs Found" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          
          if [ "$WINDOWS_TOTAL" -gt 0 ]; then
            echo "### Open Windows PRs:" >> $GITHUB_STEP_SUMMARY
            jq -r '.items[] | select(.title | ascii_downcase | test("windows|win32|msvc|mingw|\\.bat")) | "- [#\(.number)](\(.html_url)) \(.title)"' open_prs.json | head -10 >> $GITHUB_STEP_SUMMARY || true
            echo "" >> $GITHUB_STEP_SUMMARY
            
            echo "### Merged Windows PRs:" >> $GITHUB_STEP_SUMMARY
            jq -r '.items[] | select(.title | ascii_downcase | test("windows|win32|msvc|mingw|\\.bat")) | "- [#\(.number)](\(.html_url)) \(.title)"' merged_prs.json | head -10 >> $GITHUB_STEP_SUMMARY || true
          else
            echo "*No Windows-related PRs found for this date.*" >> $GITHUB_STEP_SUMMARY
          fi
          
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "---" >> $GITHUB_STEP_SUMMARY
          echo "*Note: Windows PRs identified by title keywords: windows, win32, msvc, mingw, .bat*" >> $GITHUB_STEP_SUMMARY
